<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- jQuery, Popper, Bootstrap JS (порядок важен!) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <!-- Наш скрипт (только src, без inline-кода) -->
  <script src="js/site.js" defer></script>
</head>
<body>

<header class="bg-danger text-white py-3">
    <div class="container"><h1 class="h3 mb-0">🍣 Суши-бар «Сакура»</h1></div>
</header>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="tables.html">Меню и цены</a></li>
                <li class="nav-item active"><a class="nav-link" href="forms.html">Бронь столика</a></li>
                <li class="nav-item"><a class="nav-link" href="gallery.html">Галерея</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h2>Забронировать столик</h2>

    <form id="orderForm" novalidate>
  <div class="form-group">
    <label for="name">Имя</label>
    <input type="text" class="form-control" id="name" name="name"
           placeholder="Введите имя" required>
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" class="form-control" id="email" name="email"
           placeholder="you@example.com" required>
  </div>

  <div class="form-group">
    <label for="password">Пароль</label>
    <input type="password" class="form-control" id="password" name="password"
           placeholder="Не короче 6 символов" required>
  </div>

  <div class="form-group">
    <label for="quantity">Количество товара</label>
    <input type="number" class="form-control" id="quantity" name="quantity"
           value="1" min="1" required>
  </div>

  <div class="form-group">
    <label for="comment">Комментарий</label>
    <textarea class="form-control" id="comment" name="comment" rows="3"></textarea>
  </div>

  <button type="submit" class="btn btn-primary">Оформить заказ</button>
</form>
</div>

<footer class="bg-dark text-white py-3 mt-4">
    <div class="container text-center"><p class="mb-0">© 2026 Суши-бар «Сакура»</p></div>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
